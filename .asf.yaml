github:
  description: "`csbench` is a benchmarking tool for Apache CloudStack"
  homepage: https://cloudstack.apache.org/
  labels:
    - cloudstack
    - infrastructure
    - cloud
    - go

  features:
    wiki: true
    issues: true

  enabled_merge_buttons:
    merge: false
    squash: true
    rebase: false

  collaborators:
    - kiranchavala
    - rajujith
    - vishesh92
    - acs-robot

  protected_branches:
  rulesets:
    - name: "Default Branch Protection"
      type: branch
      branches:
        includes:
          - "~DEFAULT_BRANCH"
          - "release/*"
          - "rel/*"
        excludes: []
      bypass_teams:
        - root
      restrict_deletion: true
      restrict_force_push: true
